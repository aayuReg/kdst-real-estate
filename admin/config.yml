backend:
  name: git-gateway
  branch: main

# Direct publishing: saving a property commits straight to `main` and
# Netlify rebuilds (~30-60s), same as any other git-gateway edit. There
# used to be an editorial_workflow (Draft -> In Review -> Ready) here;
# it was removed as unnecessary process overhead for a single-editor
# site. If a second reviewer is ever added and edits need approval
# before going live, re-add `publish_mode: editorial_workflow`.
media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "properties"
    label: "Properties"
    description: "Add, edit, or remove properties shown on the Properties page. Each property is its own file — use New Properties to add one, or open an existing one to edit or delete it."
    # Folder collection: one JSON file per property in data/properties/,
    # instead of one giant file holding every listing. This gives the
    # CMS sidebar a real top-level list with New/Edit/Delete per
    # property, rather than one record you scroll through to find the
    # listing you want. A build step (scripts/build-properties.js, see
    # netlify.toml) combines these into data/properties.json, which is
    # what the live site actually fetches — that combined file is
    # generated on every deploy and should not be hand-edited.
    folder: "data/properties"
    create: true
    delete: true
    # Without these two lines, Decap defaults folder collections to
    # Markdown-with-frontmatter (.md) for anything created through the
    # CMS. The existing seed listings are flat .json files, and
    # scripts/build-properties.js only reads *.json — so new entries
    # saved as .md were silently invisible to the build (deploy still
    # succeeded, since nothing about a .md file is "wrong" to the build
    # script; it just never looked at it). This forces the CMS to save
    # in the same flat-JSON format the rest of the pipeline expects.
    extension: "json"
    format: "json"
    slug: "{{fields.id}}"
    identifier_field: "id"
    summary: "{{title}} — {{priceLabel}}"
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        hint: "e.g. Premium Housing Colony - Sunsari"

      - label: "Unique ID"
        name: "id"
        widget: "string"
        hint: "Lowercase letters, numbers, and hyphens only, e.g. sunsari-premium-colony. Must be unique across all listings — used internally, not shown to visitors, and also becomes this entry's filename."
        pattern: ['^[a-z0-9]+(-[a-z0-9]+)*$', "Use lowercase letters, numbers, and hyphens only (e.g. sunsari-premium-colony) — no spaces, capitals, or symbols."]

      - label: "Display Order"
        name: "order"
        widget: "number"
        hint: "Controls the order properties appear in on the Properties page — lower numbers first. Existing listings are spaced 10 apart (10, 20, 30...) so you can slot a new one in between without renumbering everything, e.g. 25 to place it between the 20 and 30 listings."
        value_type: "int"

      - label: "Property Type"
        name: "type"
        widget: "select"
        options:
          - { label: "Land Plot", value: "land" }
          - { label: "House", value: "house" }
          - { label: "Colony Project", value: "colony" }

      - label: "Location Area"
        name: "location"
        widget: "select"
        hint: "Used by the location filter on the Properties page."
        options:
          - { label: "Kathmandu Valley", value: "kathmandu" }
          - { label: "Bhaktapur", value: "bhaktapur" }
          - { label: "Sunsari", value: "sunsari" }
          - { label: "Itahari", value: "itahari" }

      - label: "Location (shown on card)"
        name: "locationLabel"
        widget: "string"
        hint: "e.g. Lokanthali, Bhaktapur"

      - label: "Photo"
        name: "image"
        widget: "image"

      - label: "Badge (optional)"
        name: "badge"
        widget: "string"
        required: false
        hint: "e.g. Featured, New, Hot Deal. Leave blank for no badge."

      - label: "Price (shown on card)"
        name: "priceLabel"
        widget: "string"
        hint: "e.g. From NPR 45 Lakh"

      - label: "Price in Lakh (for price filter)"
        name: "priceValue"
        widget: "number"
        hint: "Numeric value in Lakh, e.g. 78. Used only for the price filter, not displayed."

      - label: "Detail Tags"
        name: "details"
        widget: "list"
        hint: "Small info chips shown on the card, e.g. size, road width, utilities."
        fields:
          - label: "Icon"
            name: "icon"
            widget: "select"
            options:
              - { label: "Ruler (size)", value: "ruler" }
              - { label: "Verified Document", value: "file-check" }
              - { label: "Road", value: "road" }
              - { label: "Houses", value: "houses" }
              - { label: "Utilities (bolt)", value: "bolt" }
              - { label: "House", value: "home" }
              - { label: "Bank Financing", value: "bank" }

          - label: "Label"
            name: "label"
            widget: "string"
            hint: "e.g. 0-3-2-0 Aana"

      - label: "Plot Map"
        name: "plots"
        widget: "list"
        required: false
        label_singular: "Plot"
        summary: "Plot {{label}} ({{block}}) — {{status}}"
        hint: "Only for Colony Project listings that should show a clickable plot map. Leave empty for Land Plot / House listings, or for colonies without plot-level detail yet. Row/Column control position within a Block — plots with the same Block name are grouped together and shown side by side on the map, with a gap between blocks standing in for the road. Row 1 is the top of the block; Column 1 is the left edge."
        fields:
          - label: "Plot Number/Label"
            name: "label"
            widget: "string"
            hint: "e.g. 12 — what's shown on the plot itself."

          - label: "Block"
            name: "block"
            widget: "string"
            hint: "Groups plots into a labeled section, e.g. Block A, Block B, Top Row. Plots sharing the same Block appear together as one grid."

          - label: "Row"
            name: "row"
            widget: "number"
            value_type: "int"
            hint: "Position from the top within this Block, starting at 1."

          - label: "Column"
            name: "col"
            widget: "number"
            value_type: "int"
            hint: "Position from the left within this Block, starting at 1."

          - label: "Size"
            name: "sizeLabel"
            widget: "string"
            hint: "e.g. 4-2-0-0 Aana"

          - label: "Price (optional)"
            name: "priceLabel"
            widget: "string"
            required: false
            hint: "e.g. NPR 48 Lakh. Leave blank to show this listing's main price instead."

          - label: "Status"
            name: "status"
            widget: "select"
            default: "available"
            options:
              - { label: "Available", value: "available" }
              - { label: "Reserved", value: "reserved" }
              - { label: "Sold", value: "sold" }
